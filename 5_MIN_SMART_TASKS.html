function phaseIndex(){return timer.left>240?0:timer.left>60?1:2}
function timerText(){return `${String(Math.floor(timer.left/60)).padStart(2,'0')}:${String(timer.left%60).padStart(2,'0')}`}
function timerInner(){return `<div class="timer-round" id="timerCircle"><div class="timer-inner"><div class="eyebrow">Қалған уақыт</div><strong id="clockDisplay">${timerText()}</strong><span id="phaseInfo">${PHASES[phaseIndex()][0]}</span></div></div><div class="timer-controls"><button class="btn primary" data-action="toggle-timer" id="timerToggle">${timer.running?'⏸ Тоқтату':'▶ Бастау'}</button><button class="btn outline" data-action="reset-timer">↺ Қайта бастау</button></div>`}
function renderTimer(){const t=selectedTask();return `<div class="toolbar"><div><div class="eyebrow">Нақты уақытпен ұйымдастыру</div><h1 style="font-size:29px;margin:3px 0">«1–3–1» таймері</h1><div class="mini-info">1 минут + 3 минут + 1 минут = 5 минут</div></div><button class="btn outline" data-action="open-class" data-id="${t.id}">🖥️ Сынып режиміне өту</button></div><div class="timer-area" style="margin-top:20px"><div class="paper timer-box">${timerInner()}<div class="small-note" style="margin-top:23px">Таймер бес минуттан бастап есептейді. Әр кезеңдегі мәтін уақытқа сай автоматты өзгереді.</div></div><div class="paper"><div class="eyebrow">Үш кезең</div><h2 style="margin:5px 0">Әр минуттың өз мақсаты бар</h2><div class="phases">${PHASES.map((p,i)=>`<div class="phase ${phaseIndex()===i?'active':phaseIndex()>i?'passed':''}" data-phase="${i}"><div class="phase-number">${[1,3,1][i]}</div><div><b>${esc(p[0])}</b><p>${esc(p[1])}</p></div></div>`).join('')}</div><div class="intro-note">📌 Таңдалған тапсырма: <b>${esc(t.title)}</b><div style="margin-top:9px"><button class="btn small teal" data-action="detail" data-id="${t.id}">Тапсырманы көру →</button></div></div></div></div>`}
function classInput(t){if(t.type==='choice')return `<div class="option-grid">${t.options.map((x,i)=>`<button class="option ${ui.selectedOption===i?'selected':''}" data-action="choose-option" data-index="${i}"><b style="margin-right:9px">${'ABC'[i]}.</b>${esc(x)}</button>`).join('')}</div>`; if(t.type==='number')return `<div class="field"><label>Жауабың (сан):</label><input id="classAnswer" type="text" inputmode="decimal" placeholder="Санды жаз..." value="${esc(ui.draft)}"></div>`;return `<div class="field"><label>Ойыңды жаз (қажет болғанда):</label><textarea id="classAnswer" class="student-input" rows="3" placeholder="Жауапты осы жерге жаз...">${esc(ui.draft)}</textarea></div>`}
function renderClass(){const t=selectedTask();return `<div class="toolbar" style="margin-bottom:18px"><div><div class="eyebrow">Проекторға және интерактивті тақтаға</div><h1 style="font-size:29px;margin:3px 0">Сынып режимі</h1></div><div class="field" style="min-width:230px"><label>Көрсетілетін тапсырма</label><select id="classTaskSelect">${TASKS.filter(x=>x.grades.includes(Number(currentGrade()))).map(x=>`<option value="${x.id}" ${ui.selected===x.id?'selected':''}>${esc(x.title)} · ${esc(subj(x.subject).label)}</option>`).join('')}</select></div></div><div class="class-layout"><div class="stage"><div class="stage-top"><div class="pill-row"><span class="chip dark">${esc(subj(t.subject).label)}</span><span class="chip">${t.grades.join(', ')}-сынып</span></div><span class="chip">⏱️ 5 минут</span></div><div class="stage-icon">${t.icon}</div><h2>${esc(t.title)}</h2><div class="stage-prompt">${esc(t.prompt)}</div>${classInput(t)}${ui.submitted?`<div class="feedback ${ui.status==='bad'?'bad':''}">${ui.status==='good'?'✓ Дұрыс! Неліктен екенін түсіндір.':ui.status==='bad'?'↺ Тағы ойланып көр. Дәлеліңді тексер.':'✓ Жауап белгіленді. Мұғаліммен бірге талқылаңыз.'}</div>`:''}${ui.showAnswer?`<div class="answer-reveal"><b>Мұғалімге арналған жауап:</b><br>${esc(t.answer)}</div>`:''}<div class="stage-toolbar"><div class="stage-timer">⏱ <span id="classClock">${timerText()}</span></div><div class="pill-row"><button class="btn small primary" data-action="submit-answer">Жауапты тексеру</button><button class="btn small outline" data-action="toggle-answer">${ui.showAnswer?'Жауапты жасыру':'Жауап үлгісін ашу'}</button></div></div></div><div class="side-lesson"><div class="panel"><div class="eyebrow">5 минуттық басқару</div><div style="text-align:center">${timerInner()}</div><hr class="hr"><h3 style="margin:0 0 8px">Мұғалімнің нұсқауы</h3><p>1 минут: ${esc(t.hook)}</p><p style="margin-top:10px">3 минут: ${esc(t.action)}</p><p style="margin-top:10px">1 минут: ${esc(t.check)}</p></div><div class="panel"><h3 style="margin:0 0 8px">Қалай қолдануға болады?</h3><p>Тапсырманы тақтада ашыңыз, оқушылар жеке карточкада да жауап бере алады. Сынып режиміндегі жауап тек демонстрацияға арналған; нақты бақылау нәтижесін «Мониторинг» бөлімінде белгілеңіз.</p><button class="btn outline" style="margin-top:15px" data-action="print-student" data-id="${t.id}">🖨️ Карточканы басып шығару</button></div></div></div>`}
function weekStats(week){const r=roster();const rs=recordSet(week);const watched=r.filter(c=>rs[c]&&rs[c].observed);let obj={total:r.length,observed:watched.length,counts:{},pcts:{}};METRICS.forEach(([key])=>{const n=watched.filter(c=>rs[c][key]).length;obj.counts[key]=n;obj.pcts[key]=watched.length?Math.round(100*n/watched.length):null});return obj}
function monitorOverview(){const s=weekStats(ui.week);return `<div class="monitor-overview"><div class="monitor-stat"><span>Сынып кодтары</span><strong>${s.total}</strong><small>Тізімге енгізілген</small></div><div class="monitor-stat"><span>Бақыланған оқушы</span><strong>${s.observed}</strong><small>${ui.week}-апта бойынша</small></div><div class="monitor-stat"><span>Қатысу үлесі</span><strong>${s.pcts.participated==null?'—':s.pcts.participated+'%'}</strong><small>Бақыланғандардан</small></div><div class="monitor-stat"><span>Дұрыс орындау</span><strong>${s.pcts.correct==null?'—':s.pcts.correct+'%'}</strong><small>Бақыланғандардан</small></div></div>`}
function monitorBars(){let start=weekStats(1),end=weekStats(4);if(!start.observed||!end.observed)return `<div class="no-data">📈 Салыстыру үшін 1-апта мен 4-аптадағы бақылау деректерін енгізіңіз.<br>Әзірше нәтижелер есептелмейді.</div>`;return `<div class="pill-row" style="margin-bottom:16px"><span class="chip">🟣 1-апта · ${start.observed} бақылау</span><span class="chip">🟢 4-апта · ${end.observed} бақылау</span></div><div class="monitor-chart">${METRICS.map(([k,l])=>`<div class="chart-row"><b>${esc(l)}</b><div style="display:grid;gap:3px"><div class="bartrack"><div class="barfill" style="width:${start.pcts[k]}%"></div></div><div class="bartrack"><div class="barfill green" style="width:${end.pcts[k]}%"></div></div></div><strong>${end.pcts[k]-start.pcts[k]>0?'+':''}${end.pcts[k]-start.pcts[k]} т.п.</strong></div>`).join('')}</div><p class="small-note">т.п. — пайыздық тармақ. Бұл кесте тек енгізілген нақты деректерге негізделген; көрсеткіштерді бірдей критериймен салыстырыңыз.</p>`}
function renderMonitor(){let r=roster(),set=recordSet();let grade=currentGrade();return `<div class="toolbar" style="margin-bottom:14px"><div><div class="eyebrow">Нақты дерекке негізделген бағалау</div><h1 style="font-size:29px;margin:3px 0">Белсенділік мониторингі</h1><div class="mini-info">${grade}-сынып · 4 апталық бақылау · оқушыларды кодпен белгілеу</div></div><div class="pill-row"><button class="btn outline small" data-action="export-csv">⬇ CSV</button><button class="btn outline small" data-action="export-json">⬇ JSON көшірме</button><button class="btn outline small" data-action="import-json">⬆ Көшірмені енгізу</button><input type="file" accept="application/json,.json" id="importJsonInput" hidden></div></div><div class="intro-note" style="margin-bottom:18px">🔐 Деректер тек осы құрылғының браузерінде сақталады. Нақты оқушы аты-жөнін емес, О-01, О-02 сияқты кодтарды пайдаланыңыз. Әр аптада алдымен «Бақыланды» бағанын белгілеңіз; пайыз тек бақыланған оқушылар бойынша есептеледі.</div><div id="monitorStats">${monitorOverview()}</div><div class="panel"><div class="toolbar"><div><h2 style="margin:0;font-size:19px">Оқушылар тізімі</h2><span class="mini-info">Бір сыныпқа бөлек кодтар сақталады</span></div><div class="pill-row"><button class="btn small soft" data-action="generate-roster">+ 25 код дайындау</button><button class="btn small outline" data-action="add-roster">+ Код қосу</button></div></div><div style="display:flex;gap:8px;align-items:center;margin-top:13px"><input class="input" style="max-width:230px" id="codeInput" placeholder="О-26 немесе өз кодыңыз"><span class="small-note">Тек код, оқушының аты-жөні емес</span></div></div>
<div class="monitor-head"><div><h2 style="margin:0 0 4px;font-size:20px">Апталық бақылау парағы</h2><div class="mini-info">Әр белгіні нақты орындалған әрекетке қарап қойыңыз</div></div><div class="week-tabs">${[1,2,3,4].map(n=>`<button class="week-tab ${ui.week===n?'active':''}" data-action="week" data-week="${n}">${n}-апта</button>`).join('')}</div></div>
${r.length?`<div class="table-wrap" id="monitorTable"><table><thead><tr><th>Оқушы коды</th><th>Бақыланды</th>${METRICS.map(([k,l])=>`<th>${esc(l)}</th>`).join('')}<th>Өшіру</th></tr></thead><tbody>${r.map(code=>{const o=set[code]||{};return `<tr><td>${esc(code)}</td>${['observed',...METRICS.map(m=>m[0])].map(k=>`<td class="checkcell"><input type="checkbox" data-check="${k}" data-code="${esc(code)}" ${o[k]?'checked':''} aria-label="${esc(code)}: ${k}"></td>`).join('')}<td><button class="btn small danger" data-action="remove-code" data-code="${esc(code)}">×</button></td></tr>`}).join('')}</tbody></table></div><div class="toolbar" style="margin-top:13px"><div class="small-note">Бір оқушы үшін алдымен «Бақыланды» белгісін қою ұсынылады. Қалған критерийлер орындалған жағдайда ғана белгіленеді.</div><button class="btn small outline" data-action="observe-all">Бәрін «бақыланды» деп белгілеу</button></div>`:`<div class="empty-state"><div class="emoji">📝</div><h3>Әзірше оқушы кодтары жоқ</h3><p>«25 код дайындау» түймесі бірден О-01–О-25 аралығындағы белгілерді жасайды. Қажет болса кодыңызды жеке қосыңыз.</p><button class="btn primary" data-action="generate-roster">25 код дайындау</button></div>`}
<div class="section-head"><div><div class="eyebrow">Бастапқы және қорытынды кезең</div><h2>1-апта ↔ 4-апта салыстыруы</h2></div></div><div class="panel" id="monitorCompare">${monitorBars()}</div><div class="callout" style="margin-top:18px"><b>Әдістемелік ескерту</b><p>Тек қатысуды өлшеу жеткіліксіз. Дұрыс орындау, дәлелдеу, білімді өмірде қолдану көрсеткіштерін бірге талдаңыз. Нақты салыстыру үшін ұқсас тапсырмалар мен бірдей бағалау критерийлерін қолданыңыз.</p></div>`}
function renderGuide(){return `<div class="eyebrow">Қысқа нұсқаулық</div><h1 style="font-size:29px;margin:4px 0 12px">Қосымшаны қалай қолданамыз?</h1><p style="color:#718099;margin:0 0 23px;max-width:730px">«5 MIN SMART TASKS» — бастауыш сынып мұғаліміне арналған дербес HTML-қосымша. Интернет, аккаунт немесе ақылы қызмет қажет емес.</p><div class="guide-grid"><div class="guide-step"><div class="num">1</div><h3>Сыныпты таңдаңыз</h3><p>Жоғарыдағы сынып таңдау тізімінен 1, 2, 3 немесе 4-сыныпты белгілеңіз. Тапсырмалар сол сыныпқа бейімделіп көрсетіледі.</p></div><div class="guide-step"><div class="num">2</div><h3>Тапсырманы ашыңыз</h3><p>Пән мен деңгейді сүзіңіз. Карточкада тапсырма, 1–3–1 кезеңдері, жауап үлгісі, бағалау критерийі және өмірлік байланыс бар.</p></div><div class="guide-step"><div class="num">3</div><h3>Бес минутты басқарыңыз</h3><p>Таймерді іске қосыңыз: 1 минут — қызығушылық, 3 минут — әрекет, 1 минут — кері байланыс. Сынып режимін проектордан көрсетуге болады.</p></div><div class="guide-step"><div class="num">4</div><h3>Карточканы басып шығарыңыз</h3><p>«Оқушы карточкасы» немесе «Мұғалімге нұсқаулық» батырмасын басыңыз. Браузердегі басып шығару мәзірінен қағазға не PDF ретінде сақтаңыз.</p></div><div class="guide-step"><div class="num">5</div><h3>Нәтижені бақылаңыз</h3><p>Оқушыларға код тағайындаңыз. Әр аптада бақыланғандарды және орындаған критерийлерін белгілеңіз. 1 және 4-аптаның көрсеткіштері автоматты салыстырылады.</p></div><div class="guide-step"><div class="num">6</div><h3>Резервтік көшірме жасаңыз</h3><p>Мониторингтен CSV есебін немесе толық JSON көшірмесін жүктеңіз. Басқа құрылғыда сол көшірмені импорттауға болады.</p></div></div><div class="section-head"><div><h2>Практикалық ұсыныстар</h2></div></div><div class="info-grid"><div class="info-card"><div class="icon">👧</div><h3>Ұяң оқушы</h3><p>Алдымен жеке жазуға, содан кейін жұбымен бөлісуге мүмкіндік беріңіз. Міндетті түрде көпшілік алдында жауап беруді талап етпеңіз.</p></div><div class="info-card"><div class="icon" style="background:#e4f8f3">🙌</div><h3>Бүкіл сынып</h3><p>Жауап карточкаларын бір мезетте көрсеткізіңіз. Осылайша тек қол көтерген оқушылармен шектелмейсіз.</p></div><div class="info-card"><div class="icon" style="background:#fff2e3">🧠</div><h3>Қосымша қолдау</h3><p>Қиналатын балаға тірек сөз, жылдам орындаған балаға «Неге?» немесе «Тағы қалай?» сұрағын ұсыныңыз.</p></div></div><div class="callout" style="margin-top:24px"><b>Құпиялылық және деректер</b><p>Қосымша ешбір деректі интернетке жібермейді. Сақтау браузердің жергілікті жадысында орындалады, сондықтан браузер кэшін тазарту кезінде жоғалуы мүмкін. Оқушылардың толық аты-жөнін жазбаңыз, сынып коды жеткілікті. Маңызды бақылау нәтижелерін жүйелі түрде экспорттап отырыңыз.</p></div>`}
function renderEditor(){const t=ui.editId?TASKS.find(x=>x.id===ui.editId):null;const grade=t?.grades||[Number(currentGrade())];const pick=(id,value='',type='text',placeholder='')=>`<div class="field"><label for="${id}">${({editTitle:'Тапсырманың атауы',editPrompt:'Оқушыға арналған негізгі тапсырма',editHook:'1 минут — қызығушылық ояту',editActivity:'3 минут — белсенді әрекет',editCheck:'1 минут — тексеру, кері байланыс',editAnswer:'Мұғалімге арналған жауап / нұсқаулық',editLife:'Өмірмен байланыс',editTools:'Қажетті құралдар',editCriteria:'Бағалау критерийлері (әр жолға біреу)'})[id]}</label>${type==='textarea'?`<textarea id="${id}" rows="${id==='editPrompt'?4:3}" placeholder="${esc(placeholder)}">${esc(value)}</textarea>`:`<input id="${id}" value="${esc(value)}" placeholder="${esc(placeholder)}" maxlength="160">`}</div>`;return `<div class="bread"><button data-action="go" data-page="bank">← Тапсырмалар банкі</button> / <span>${t?'Тапсырманы өңдеу':'Жаңа тапсырма'}</span></div><div class="eyebrow">Авторлық тапсырма құрастыру</div><h1 style="font-size:30px;margin:4px 0 8px">${t?'Тапсырманы өңдеу':'Өз тапсырмамды қосу'}</h1><p style="color:#6b7b93;margin:0 0 20px">Жасаған карточкаңыз тапсырмалар банкіне қосылады және осы браузерде сақталады.</p><div class="detail-layout"><div class="paper" style="display:grid;gap:17px">${pick('editTitle',t?.title||'','text','Мысалы: Дүкендегі есеп')}${pick('editPrompt',t?.prompt||'','textarea','Оқушы орындайтын нақты, қысқа тапсырманы жазыңыз...')}<div class="grid-editor" style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><div class="field"><label>Пән</label><select id="editSubject">${SUBJECTS.map(s=>`<option value="${s.id}" ${(t?.subject||'math')===s.id?'selected':''}>${s.icon} ${esc(s.label)}</option>`).join('')}</select></div><div class="field"><label>Деңгей</label><select id="editLevel">${['Оңай','Орта','Күрделі'].map(x=>`<option ${x===(t?.level||'Орта')?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="field"><label>Қай сыныптарға арналған?</label><div class="pill-row">${[1,2,3,4].map(n=>`<label class="chip" style="cursor:pointer"><input type="checkbox" name="editGrade" value="${n}" ${grade.includes(n)?'checked':''}> ${n}-сынып</label>`).join('')}</div></div><hr class="hr" style="margin:0">${pick('editHook',t?.hook||'','textarea','Тақырыпқа қызықтыратын сұрақ...')}${pick('editActivity',t?.action||'','textarea','Оқушылар 3 минутта не істейді?')}${pick('editCheck',t?.check||'','textarea','Жауапты қалай тексереді?')}${pick('editAnswer',t?.answer||'','textarea','Үлгі жауап немесе бағалау бағдарлары...')}${pick('editLife',t?.life||'','textarea','Оқушы бұл білімді қайда қолданады?')}${pick('editTools',t?.tools||'','text','Қағаз, карточка, қалам...')}${pick('editCriteria',t?.criteria?.join('\n')||'','textarea','Дұрыс орындайды\nОйын түсіндіреді')}<div class="pill-row"><button class="btn primary" data-action="save-task">💾 Сақтау және ашу</button><button class="btn outline" data-action="go" data-page="bank">Бас тарту</button></div></div><aside class="side-lesson"><div class="panel"><div class="eyebrow">Тапсырманы жоспарлау</div><h3 style="margin:8px 0 12px">Жақсы карточкаға не қажет?</h3><ul class="plain-list"><li>Оқушы жасына сәйкес бір нақты міндет</li><li>1 минутта түсінікті болатын нұсқау</li><li>3 минутта орындауға болатын әрекет</li><li>1 минуттық тексеру мен кері байланыс</li><li>Күнделікті өмірден алынған мысал</li><li>2–3 өлшенетін бағалау критерийі</li></ul></div><div class="intro-note">🔒 Жеке құрастырылған тапсырма тек осы браузерде сақталады. «Мониторинг» бөлімінен JSON резервтік көшірмесін алсаңыз, авторлық тапсырмалар да бірге сақталады.</div></aside></div>`}
function newTask(){ui.editId=null;nav('editor')}
function editTask(id){const t=TASKS.find(t=>t.id===id);if(!t?.custom)return;ui.editId=id;nav('editor')}
function saveTask(){const value=id=>($('#'+id)?.value||'').trim(),grades=Array.from(document.querySelectorAll('[name="editGrade"]:checked')).map(x=>Number(x.value));const title=value('editTitle'),prompt=value('editPrompt');if(!title||!prompt){toast('Тапсырма атауы мен мәтінін енгізіңіз.');return}if(!grades.length){toast('Кемінде бір сыныпты таңдаңыз.');return}const subject=value('editSubject'),sub=subj(subject);const task={id:ui.editId||'custom_'+Date.now(),custom:true,title:title.slice(0,150),subject,grades,level:value('editLevel'),icon:sub.icon,type:'open',prompt,hook:value('editHook')||'Қызығушылық оятатын қысқа сұрақ қойыңыз.',action:value('editActivity')||'Әр оқушы тапсырманы жеке орындайды, жұбымен талқылайды.',check:value('editCheck')||'Жауаптарды салыстырып, кері байланыс беріңіз.',answer:value('editAnswer')||'Мұғалім жауаптарды бағалау критерийімен салыстырады.',life:value('editLife')||'Күнделікті өмірде қолдану мысалын талқылаңыз.',tools:value('editTools')||'Жауап парағы, қалам',criteria:value('editCriteria').split('\n').map(x=>x.trim()).filter(Boolean).slice(0,8),tags:['авторлық тапсырма']};if(!task.criteria.length)task.criteria=['Тапсырманы орындайды','Ойын түсіндіреді'];const i=TASKS.findIndex(x=>x.id===task.id);if(i>=0)TASKS[i]=task;else TASKS.push(task);const j=store.customTasks.findIndex(x=>x.id===task.id);if(j>=0)store.customTasks[j]=task;else store.customTasks.push(task);ui.editId=null;ui.grade=String(grades[0]);save();chooseTask(task.id);toast('Авторлық тапсырма сақталды')}
function deleteTask(id){const t=TASKS.find(x=>x.id===id);if(!t?.custom)return;if(!confirm(`«${t.title}» тапсырмасын өшіру керек пе?`))return;store.customTasks=store.customTasks.filter(x=>x.id!==id);store.favorites=store.favorites.filter(x=>x!==id);const i=TASKS.findIndex(x=>x.id===id);if(i>=0)TASKS.splice(i,1);save();ui.selected='shop';nav('bank');toast('Авторлық тапсырма өшірілді')}

function topTitle(){return ({home:'Басты бет',bank:'Тапсырмалар банкі',detail:'Тапсырма картасы',timer:'1–3–1 таймері',class:'Сынып режимі',monitor:'Белсенділік мониторингі',guide:'Нұсқаулық',editor:'Авторлық тапсырма'})[ui.page]||'Басты бет'}
function render(){document.title=`5 MIN SMART TASKS — ${topTitle()}`;$('#nav').innerHTML=PAGES.map(([id,ic,l])=>`<button class="nav-btn ${ui.page===id||(['detail','editor'].includes(ui.page)&&id==='bank')?'active':''}" data-action="go" data-page="${id}"><span class="nav-ico">${ic}</span><span class="nav-txt">${l}</span></button>`).join('');$('#mobileNav').innerHTML=PAGES.slice(0,5).map(([id,ic,l])=>`<button class="${ui.page===id||(['detail','editor'].includes(ui.page)&&id==='bank')?'active':''}" data-action="go" data-page="${id}"><span>${ic}</span>${id==='home'?'Басты':id==='bank'?'Тапсырма':id==='timer'?'Таймер':id==='class'?'Сынып':'Нәтиже'}</button>`).join('');$('#crumb').innerHTML=`<span class="crumbs">5 MIN SMART TASKS / ${topTitle()}<strong>${ui.page==='home'?'Қош келдіңіз!':topTitle()}</strong></span>`;$('#gradeSelect').value=ui.grade;$('#viewRoot').innerHTML=({home:renderHome,bank:renderBank,detail:renderDetail,timer:renderTimer,class:renderClass,monitor:renderMonitor,guide:renderGuide,editor:renderEditor})[ui.page]();updateClockUI()}
function updateClockUI(){let txt=timerText(),i=phaseIndex();document.querySelectorAll('#clockDisplay,#classClock,#sidebarClock').forEach(el=>el.textContent=txt);document.querySelectorAll('#phaseInfo').forEach(el=>el.textContent=PHASES[i][0]);document.querySelectorAll('#timerCircle').forEach(el=>el.style.background=`conic-gradient(#7961dc ${(300-timer.left)/300*360}deg,#edf0f8 0)`);document.querySelectorAll('[data-phase]').forEach(el=>{let n=Number(el.dataset.phase);el.classList.toggle('active',n===i);el.classList.toggle('passed',n<i)});document.querySelectorAll('#timerToggle').forEach(el=>el.textContent=timer.running?'⏸ Тоқтату':'▶ Бастау')}
function stopTimer(){timer.running=false;clearInterval(timer.interval);timer.interval=null;updateClockUI()}
function beep(){try{let ctx=new(window.AudioContext||window.webkitAudioContext)(),o=ctx.createOscillator(),g=ctx.createGain();o.type='sine';o.frequency.value=690;g.gain.value=.045;o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.17);o.onended=()=>ctx.close()}catch(e){}}
function tick(){if(timer.left>0){timer.left--;if([240,60,0].includes(timer.left))beep();if(timer.left===0){stopTimer();toast('5 минут аяқталды! Қорытынды жасаңыз.')}}else stopTimer();updateClockUI()}
function toggleTimer(){if(timer.running)stopTimer();else{if(timer.left===0)timer.left=300;timer.running=true;timer.interval=setInterval(tick,1000);updateClockUI()}}
function resetTimer(){stopTimer();timer.left=300;updateClockUI()}
function toggleFavorite(id){const i=store.favorites.indexOf(id);if(i>=0)store.favorites.splice(i,1);else store.favorites.push(id);save();render();toast(i>=0?'Таңдаулыдан алынды':'Таңдаулыға қосылды')}
function addCode(){let value=($('#codeInput')?.value||'').trim();if(!value){toast('Алдымен код енгізіңіз (мысалы, О-26).');return}if(value.length>24||!/^[\p{L}\p{N}_\- ]+$/u.test(value)){toast('Кодта тек әріп, сан, бос орын, дефис болсын.');return}const a=roster();if(a.includes(value)){toast('Бұл код тізімде бар.');return}a.push(value);save();render();toast('Оқушы коды қосылды')}
function generateRoster(){let a=roster();for(let n=1;n<=25;n++){let code=`О-${String(n).padStart(2,'0')}`;if(!a.includes(code))a.push(code)}save();render();toast('25 оқушы коды дайын')}
function changeCheck(code,k,v){const set=recordSet();const o=set[code]||{observed:false,participated:false,independent:false,correct:false,reasoned:false,applied:false};o[k]=v;if(k!=='observed'&&v)o.observed=true;if(k==='observed'&&!v)METRICS.forEach(([key])=>o[key]=false);set[code]=o;save();const row=Array.from(document.querySelectorAll('#monitorTable tbody tr')).find(row=>row.firstElementChild?.textContent===code);if(row){row.querySelectorAll('[data-check]').forEach(box=>box.checked=!!o[box.dataset.check])}refreshMonitor()}
function refreshMonitor(){if($('#monitorStats'))$('#monitorStats').innerHTML=monitorOverview();if($('#monitorCompare'))$('#monitorCompare').innerHTML=monitorBars()}
function removeCode(code){if(!confirm(`«${code}» кодын тізімнен және барлық апталық бақылаудан өшіру керек пе?`))return;store.rosters[currentGrade()]=roster().filter(x=>x!==code);for(let w=1;w<=4;w++)delete recordSet(w)[code];save();render();toast('Код өшірілді')}
function observeAll(){if(!roster().length)return;let rs=recordSet();roster().forEach(code=>rs[code]={...(rs[code]||{}),observed:true});save();render();toast('Барлық код үшін «Бақыланды» белгіленді')}
function safeFile(content,filename,mime){const blob=new Blob([content],{type:mime}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
function exportCSV(){const lines=[['Сынып','Апта','Оқушы коды','Бақыланды',...METRICS.map(x=>x[1])]];for(let g=1;g<=4;g++){for(let w=1;w<=4;w++){for(let code of (store.rosters[g]||[])){const r=store.records[g]?.[w]?.[code]||{};lines.push([`${g}`,`${w}`,code,...['observed',...METRICS.map(x=>x[0])].map(k=>r[k]?'Иә':'Жоқ')])}}}const cell=v=>'"'+String(v).replace(/"/g,'""')+'"';safeFile('\ufeff'+lines.map(row=>row.map(cell).join(';')).join('\r\n'),'5_MIN_SMART_TASKS_monitoring.csv','text/csv;charset=utf-8');toast('CSV есебі жүктелді')}
function exportJSON(){safeFile(JSON.stringify({app:'5 MIN SMART TASKS',version:1,savedAt:new Date().toISOString(),data:store},null,2),'5_MIN_SMART_TASKS_backup.json','application/json');toast('Резервтік көшірме жүктелді')}
function importJSON(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj?.app!=='5 MIN SMART TASKS'||!obj.data||!obj.data.rosters||!obj.data.records)throw Error();if(!confirm('Резервтік көшірме ағымдағы бақылау деректерін алмастырады. Жалғастыру керек пе?'))return;store={...DEFAULT_STORE(),...obj.data};save();render();toast('Көшірме сәтті енгізілді')}catch(e){toast('JSON файлы жарамсыз немесе осы қосымшадан емес')}};reader.readAsText(file)}
function checkAnswer(){const t=selectedTask();let result='manual';if(t.type==='choice'){if(ui.selectedOption==null){toast('Алдымен жауапты таңдаңыз');return}result=ui.selectedOption===t.correct?'good':'bad'}else if(t.type==='number'){let value=$('#classAnswer')?.value||'';ui.draft=value;if(!value.trim()){toast('Алдымен жауапты жазыңыз');return}result=value.replace(/\s/g,'').replace(',','.')===t.correctAnswer?'good':'bad'}else{ui.draft=$('#classAnswer')?.value||'';result='manual'}ui.status=result;ui.submitted=true;render();toast(result==='good'?'Дұрыс жауап!':result==='bad'?'Тағы ойланып көріңіз':'Жауапты мұғаліммен талқылаңыз')}
function preparePrint(t,teacher){const el=$('#printLayer');if(teacher){el.innerHTML=`<section class="print-page"><div class="stamp">5 MIN SMART TASKS · МҰҒАЛІМГЕ НҰСҚАУЛЫҚ</div><h1>${esc(t.title)}</h1><div class="print-sub">${esc(subj(t.subject).label)} · ${t.grades.join(', ')}-сынып · 5 минут</div><h2>Тапсырма</h2><div class="question-print">${esc(t.prompt)}</div><h2>«1–3–1» сценарийі</h2><div class="t-step"><b>1 минут:</b> ${esc(t.hook)}<br><b>3 минут:</b> ${esc(t.action)}<br><b>1 минут:</b> ${esc(t.check)}</div><h2>Жауап үлгісі</h2><div>${esc(t.answer)}</div><h2>Бағалау критерийі</h2><div>${t.criteria.map(x=>'✓ '+esc(x)).join('<br>')}</div><p style="margin-top:8mm">Өмірмен байланыс: ${esc(t.life)}</p><footer>© 5 MIN SMART TASKS • Бұл материалды сыныпқа бейімдеуге болады</footer></section>`}else{el.innerHTML=`<section class="print-page"><div class="stamp">⏱ 5 МИНУТТЫҚ ТАПСЫРМА</div><h1>${esc(t.title)}</h1><div class="print-sub">${esc(subj(t.subject).label)} · ${t.grades.join(', ')}-сынып</div><p>Оқушы коды: ______________ &nbsp;&nbsp; Күні: ______________</p><h2>Ойлан • Орында • Тексер</h2><div class="question-print">${esc(t.prompt)}</div>${t.options?`<div style="font-size:15pt;margin-top:9mm">${t.options.map((opt,i)=>`${'ABC'[i]}) □ ${esc(opt)}`).join('<br><br>')}</div>`:''}<h2>Менің жауабым:</h2><div class="print-answer-lines"></div><p style="margin-top:8mm">Мен өз жауабымды түсіндіре аламын: □ Иә &nbsp; □ Әлі жаттығамын</p><footer>5 MIN SMART TASKS • 1 минут + 3 минут + 1 минут</footer></section>`}window.print()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;let a=b.dataset.action,id=b.dataset.id;switch(a){case'go':nav(b.dataset.page);break;case'new-task':newTask();break;case'edit-task':editTask(id);break;case'save-task':saveTask();break;case'delete-task':deleteTask(id);break;case'detail':chooseTask(id);break;case'favorite':toggleFavorite(id);break;case'clear-filters':ui.search='';ui.subject='all';ui.level='all';ui.favoriteOnly=false;render();break;case'open-class':if(id)ui.selected=id;ui.selectedOption=null;ui.submitted=false;ui.showAnswer=false;ui.draft='';nav('class');break;case'open-timer':if(id)ui.selected=id;nav('timer');break;case'toggle-timer':toggleTimer();break;case'reset-timer':resetTimer();break;case'print-student':preparePrint(TASKS.find(x=>x.id===id)||selectedTask(),false);break;case'print-teacher':preparePrint(TASKS.find(x=>x.id===id)||selectedTask(),true);break;case'choose-option':ui.selectedOption=Number(b.dataset.index);ui.submitted=false;render();break;case'submit-answer':checkAnswer();break;case'toggle-answer':ui.showAnswer=!ui.showAnswer;ui.draft=$('#classAnswer')?.value||ui.draft;render();break;case'week':ui.week=Number(b.dataset.week);render();break;case'generate-roster':generateRoster();break;case'add-roster':addCode();break;case'remove-code':removeCode(b.dataset.code);break;case'observe-all':observeAll();break;case'export-csv':exportCSV();break;case'export-json':exportJSON();break;case'import-json':$('#importJsonInput')?.click();break;default:break}});
document.addEventListener('change',e=>{let x=e.target;if(x.id==='gradeSelect'){ui.grade=x.value;const t=TASKS.find(t=>t.grades.includes(Number(currentGrade())));if(t&&!selectedTask().grades.includes(Number(currentGrade())))ui.selected=t.id;render()}else if(x.id==='subjectFilter'){ui.subject=x.value;render()}else if(x.id==='levelFilter'){ui.level=x.value;render()}else if(x.id==='favoriteOnly'){ui.favoriteOnly=x.checked;render()}else if(x.id==='classTaskSelect'){chooseTask(x.value,'class')}else if(x.dataset.check){changeCheck(x.dataset.code,x.dataset.check,x.checked)}else if(x.id==='importJsonInput'){importJSON(x.files?.[0])}});
let searchWait=null;document.addEventListener('input',e=>{if(e.target.id==='searchInput'){ui.search=e.target.value;clearTimeout(searchWait);searchWait=setTimeout(()=>{let focusPos=e.target.selectionStart;let active=document.activeElement?.id==='searchInput';const grid=$('#viewRoot');grid.innerHTML=renderBank();if(active){let i=$('#searchInput');i?.focus();i?.setSelectionRange(focusPos,focusPos)}},250)}else if(e.target.id==='classAnswer'){ui.draft=e.target.value}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='codeInput'){e.preventDefault();addCode()}});
render();
</script>
</body>
